[project]
name = "anp-producao"
version = "1.1.0"
description = "Produção mensal de petróleo, gás e água por campo a partir dos dados abertos da ANP. Site local, linha de comando e servidor MCP para agentes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "truststore>=0.9",
  "mcp>=2.3,<3",
]

[project.scripts]
anp = "anp_producao.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anp_producao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
